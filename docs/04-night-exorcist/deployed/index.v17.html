<body>
<canvas id="cv"></canvas>
<div id="toast"></div>
<div id="kbHint" hidden>WASD / 방향키: 이동</div>

<div id="menu" class="panel show">
  <h1>밤의 퇴마사</h1>
  <p class="sub">움직이기만 하세요. 공격은 알아서 합니다. 동이 틀 때까지 10분.</p>
  <div id="diffs" class="row" style="margin:0 0 6px"></div>
  <div id="stages"></div>
  <div class="stnav"><button id="stPrev" class="ghost">‹ 이전 밤</button><div id="stDots" class="dots"></div><button id="stNext" class="ghost">다음 밤 ›</button></div>
  <button id="startBtn" class="big">밤으로 나서기</button>
  <div class="row"><button id="shrineBtn" class="ghost hide" style="flex:1">사당</button><button id="chalBtn" class="ghost hide" style="flex:1">주간 챌린지</button></div>
  <p id="menuBest" class="msg" style="text-align:center"></p>
</div>

<div id="shrine" class="panel">
  <div id="shHead"><div><h1 style="font-size:24px; margin-bottom:2px">사당</h1><p class="msg" style="margin:0">엽전으로 수련, 조각으로 뽑기 — 강해지는 곳</p></div><p id="shWallet" class="wal"></p></div>
  <div class="tabs"><button id="tabTrain" class="ghost on"><img id="icTrain" alt="">수련</button><button id="tabGacha" class="ghost"><img id="icGacha" alt="">뽑기</button><button id="tabDeck" class="ghost"><img id="icDeck" alt="">덱</button><button id="tabCodex" class="ghost"><img id="icCodex" alt="">도감</button></div>
  <div id="shBody"></div>
  <button id="shClose" class="big">닫기</button>
</div>

<div id="chal" class="panel">
  <h1 style="font-size:24px">주간 챌린지</h1>
  <p id="chalDesc" class="sub"></p>
  <div id="chalTop"></div>
  <div class="row"><input id="chalNick" maxlength="12" placeholder="닉네임" aria-label="닉네임"></div>
  <button id="chalGo" class="big">도전</button>
  <button id="chalClose" class="ghost" style="width:100%; margin-top:8px">닫기</button>
</div>

<div id="lv" class="panel">
  <h2>수련의 성과</h2>
  <div id="lvCards"></div>
</div>

<div id="chest" class="panel">
  <h2 id="chTitle" style="font-size:22px; text-align:center; margin-bottom:12px">상자</h2>
  <div id="chList"></div>
  <button id="chBtn" class="big">계속</button>
</div>

<div id="over" class="panel">

  <div class="stat"><span>버틴 시간</span><b id="ovTime">0:00</b></div>
  <div class="stat"><span>처치</span><b id="ovKills">0</b></div>
  <div class="stat"><span>도달 레벨</span><b id="ovLvl">1</b></div>
  <div class="stat"><span>엽전</span><b id="ovCoins">+0</b></div>

  <div id="regBox" class="hide">

    <div class="row"><input id="nick" maxlength="12" placeholder="닉네임" aria-label="닉네임"><input id="pin" maxlength="4" inputmode="numeric" placeholder="PIN 4자리" aria-label="PIN"></div>
    <div class="row"><button id="cloudBtn" class="ghost" style="width:100%">서버에 저장</button></div>
    <div id="cloudMsg" class="msg"></div>
  </div>
  <button id="againBtn" class="big">다시 밤으로</button>
  <button id="homeBtn" class="ghost" style="width:100%; margin-top:8px">사당·덱으로</button>
</div>

<script>
// ───────── 설정 ─────────
const SLUG = 'night-exorcist', SAVE_KEY = 'wk_' + SLUG, BALANCE = 3;
const SB_URL = 'https://fpjgjwazqpfiffnsgume.supabase.co', SB_KEY = 'sb_publishable_I1YgcnYNBOaGy0WwozO2wQ_PGwsLtU5';
const sbHeaders = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
function logEvent(event, score = null, variant = null) { try { fetch(SB_URL + '/rest/v1/play_events', { method:'POST', headers:sbHeaders, keepalive:true, body:JSON.stringify({ game_id:SLUG, event, score, variant }) }).catch(() => {}); } catch (e) {} }
// 밸런싱용 맥락: v<BAL>|s<스테이지>|<clear|dead>|lv<레벨>|k<처치>|tr<수련합>|m<숙련합>|runs<n>|chal?|d:<덱>
function runVariant(end) { const tr = Object.values(META.train).reduce((a, b) => a + b, 0), m = S.deck.reduce((a, id) => a + (META.owned[id] || 0), 0); return `v${BALANCE}|s${S.stage + 1}${S.diff ? DIFFS[S.diff].id[0] : ''}|${end}|lv${S.lvl}|k${S.kills}|tr${tr}|m${m}|runs${META.runs}${S.chal ? '|chal' : ''}|d:${S.deck.join(',')}`; }
async function sha256(str) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
const TEST = /[?&]test=1/.test(location.search);

// 수식 — docs/04-night-exorcist/sim/run-sim.mjs 와 동일
const C = { RUN:600, SPAWN0:1.2, SPAWN_K:.0075, HP0:10, HP_G:1.0038, ENEMY_SPD:1.15, CAP:60, CONTACT:3, HP_PLAYER:100, REGEN:.35, LVL_XP0:12, LVL_XP_G:1.18,
  BOSS1_AT:300, BOSS1_HP:40, BOSS2_AT:540, BOSS2_HP:120, SPEED:110, PICK_R:70, META_G:1.0, META_D:.9 };
// 스테이지: els = 이 밤에 나오는 속성 3개(잡몹·정예는 스폰 시 랜덤), roster = 전용 잡몹 5, bosses = 전용 보스 2(속성 고정)

async function cloudSave(force) {

  if (!force && Date.now() - cloudLast < 30000) return; cloudBusy = true;
  try { const r = await fetch(`${SB_URL}/rest/v1/rpc/weekly_save`, { method:'POST', headers:sbHeaders, keepalive:true, body:JSON.stringify({ p_game_id:SLUG, p_player:nick, p_pin_hash:hash, p_data:META, p_runs:META.runs }) });

let AC = null;
function audio() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e) {} }
function tone(f, t, type = 'sine', vol = .08, slide = 0) { try { if (!AC) return; const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), AC.currentTime + t); g.gain.setValueAtTime(vol, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + t); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + t); } catch(e) {} }
function noise(t, vol = .06, f = 1200) { try { if (!AC) return; const n = AC.sampleRate * t, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * (1 - i/n); const s = AC.createBufferSource(); s.buffer = b; const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = .9; const g = AC.createGain(); g.gain.value = vol; s.connect(bp); bp.connect(g); g.connect(AC.destination); s.start(); } catch(e) {} }

  for (const b of nearObst(P.x, P.y)) if (b.hazard && Math.hypot(P.x - b.x, P.y - b.y) < b.r) { S.hp -= 6 * dt * dmgTaken(); S.hitT = .15; S.burnT = Math.max(S.burnT, .5); }
  if (st.shrink) { if (!E.some(o => o.boss)) S.shrinkT += dt; const R = arenaR(), d = Math.hypot(P.x, P.y); if (d > R) { S.hp -= 5 * dt * dmgTaken(); S.hitT = .15; S.fogT = Math.min(1, S.fogT + dt * 2); if (Math.random() < dt * 2) float(P.x, P.y - 30, '안개', '#a0b0d0', 11); } else S.fogT = Math.max(0, S.fogT - dt); }

  cam.x += (P.x - cam.x) * Math.min(1, dt * 8); cam.y += (P.y - cam.y) * Math.min(1, dt * 8);
}
function tick(dt) {
  if (S.freeze > 0) { S.freeze -= dt; return; }

function fx(dt) {

function pfx(x, y, spr, opt = {}) { if (PFX.length > 260) PFX.shift(); PFX.push({ x, y, vx:opt.vx || 0, vy:opt.vy == null ? -18 : opt.vy, spr, t:0, life:opt.life || .55, sc:opt.sc || 1, flip:Math.random() < .5 }); }

function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; }
const CHAL_ID = SLUG + '#' + isoWeek();
async function openChal() { S.mode = 'chal'; show('menu', false); document.getElementById('chalDesc').textContent = `${isoWeek()} · 달빛 초원 · 고정 덱(부적·목검·방울·죽창·물구슬·낫) · 수련·숙련 미적용 · 모두 같은 요괴 순서. 점수 = 생존 초 × 1000 + 처치` + (META.chalBest ? ` · 내 최고 ${META.chalBest.toLocaleString()}` : '');
  document.getElementById('chalNick').value = store.get('ne-nick') || ''; const top = document.getElementById('chalTop'); top.innerHTML = '<p class="msg">순위 불러오는 중…</p>'; show('chal', true);
  try { const r = await fetch(`${SB_URL}/rest/v1/daily_rankings?game_id=eq.${encodeURIComponent(CHAL_ID)}&select=nickname,score&order=score.desc,created_at.asc&limit=5`, { headers:sbHeaders }); const rows = await r.json(); top.innerHTML = rows.length ? rows.map((x, i) => `<div class="rank"><span><b style="color:${i < 3 ? '#b5392f' : '#5a4e3a'}">${i + 1}</b> ${x.nickname}</span><b>${Number(x.score).toLocaleString()}</b></div>`).join('') : '<p class="msg">이번 주 첫 도전자가 되어 보세요</p>'; } catch (e) { top.innerHTML = '<p class="msg">랭킹 서버에 연결할 수 없어요</p>'; } }
function submitChal(score) { const nick = store.get('ne-nick'); if (!nick) return; try { fetch(`${SB_URL}/rest/v1/daily_rankings`, { method:'POST', headers:sbHeaders, keepalive:true, body:JSON.stringify({ game_id:CHAL_ID, nickname:nick, score }) }).catch(() => {}); } catch (e) {} }
document.getElementById('chalBtn').addEventListener('click', openChal);
document.getElementById('chalClose').addEventListener('click', () => { show('chal', false); S.mode = 'menu'; show('menu', true); });
document.getElementById('chalGo').addEventListener('click', () => { const nick = document.getElementById('chalNick').value.trim(); if (!nick) { toast('닉네임을 적어주세요'); return; } store.set('ne-nick', nick); show('chal', false); S.chal = { id:CHAL_ID, seed:hashStr(CHAL_ID) }; startGame(); });
function menuBest() { const b = META.best.time ? `최고 ${Math.floor(META.best.time/60)}:${String(Math.floor(META.best.time%60)).padStart(2,'0')} · 런 ${META.runs}회 · 엽전 ${META.coins}` : ''; document.getElementById('menuBest').textContent = b; }
renderMenu(); logEvent('load');

// ───────── 루프 ─────────
let last = 0, frameMs = [];
function frame(ts) { let dt = (ts - last) / 1000 || 0; last = ts; if (dt > .1) dt = .1; const t0 = performance.now();
  if (S.mode === 'play') tick(dt); fx(dt); draw(); if (TEST) { frameMs.push(performance.now() - t0); if (frameMs.length > 600) frameMs.shift(); } requestAnimationFrame(frame); }
requestAnimationFrame(frame);
if (TEST) window.GAME = { S, P, E, B, G, EB, ZONE, CHESTS, META, WBY, ENEMY, GRIDS, EVOS, EBY, evoOptions, weaponOf, dmgOf, WCD, dropGem, gachaPool, BEATS, LOOPS, arenaR, STRIKES, ARC, DIFFS, diffUnlocked, bestOf, gachaN, curDiff, elIcon, statIcon, renderStages, PFX, pfx, affinity, gacha, openShrine, renderShrine, openChal, CHAL_DECK, TRAIN, trainCost, hitWith, migrate, isoWeek, hashStr, openChest, bossPattern, nearObst, ELITE_AT, C, STAGES, WEAPONS, PASSIVES, tick, startGame, endRun, spawn, kill, levelUp, pick, choices, inputVec, KEY, JOY, frameMs: () => frameMs, enemyHp, hurtEnemy };
