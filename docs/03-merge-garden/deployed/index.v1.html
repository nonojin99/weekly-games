<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>이슬 정원</title>
<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height:100%; overflow:hidden; background:#1a2a1f; }
  body { font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; color:#f3f0e6; word-break: keep-all; touch-action:none; overscroll-behavior:none; user-select:none; -webkit-user-select:none; }
  #cv { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hide { display:none !important; }
  .panel { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%) translateY(12px); width:min(92vw, 400px); background:rgba(22,34,26,.96); border:1px solid rgba(255,255,255,.12); border-radius:20px; padding:24px; opacity:0; pointer-events:none; transition: opacity .25s ease-out, transform .25s ease-out; z-index:20; }
  .panel.show { opacity:1; pointer-events:auto; transform:translate(-50%,-50%); }
  h1 { font-size:34px; letter-spacing:-1px; margin-bottom:8px; }
  .sub { font-size:14px; color:#cfd8c9; line-height:1.5; margin-bottom:16px; }
  button { font: inherit; color:#1a2a1f; background:#e9d98c; border:0; border-radius:16px; min-height:48px; padding:0 24px; font-size:17px; font-weight:700; cursor:pointer; box-shadow:0 4px 0 #a58f3a; transition: transform .1s, box-shadow .1s; }
  button:active { transform: translateY(2px) scale(.98); box-shadow:0 2px 0 #a58f3a; }
  button.ghost { background:transparent; color:#e9d98c; box-shadow:none; border:1px solid rgba(233,217,140,.4); min-height:44px; font-size:14px; font-weight:600; }
  button:focus-visible, input:focus-visible { outline:3px solid #4da3ff !important; outline-offset:2px; }
  .big { width:100%; min-height:56px; font-size:19px; margin-top:8px; }
  .row { display:flex; gap:8px; margin-top:12px; }
  input { font:inherit; font-size:16px; min-height:44px; padding:0 12px; border-radius:12px; border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.25); color:#fff; width:100%; }
  .msg { font-size:13px; color:#cfd8c9; min-height:18px; margin-top:8px; }
  .stat { display:flex; justify-content:space-between; font-size:15px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.08); }
  .stat b { color:#e9d98c; }
  #toast { position:fixed; left:50%; top:calc(var(--sat) + 72px); transform:translateX(-50%) scale(.9); background:rgba(14,24,18,.92); border:1px solid rgba(233,217,140,.35); color:#f3f0e6; padding:10px 16px; border-radius:12px; font-size:14px; opacity:0; transition: opacity .15s, transform .15s; pointer-events:none; z-index:30; max-width:86vw; text-align:center; }
  #toast.show { opacity:1; transform:translateX(-50%) scale(1); }
  #kbHint { position:fixed; bottom:calc(var(--sab) + 6px); left:0; right:0; text-align:center; font-size:11px; color:rgba(255,255,255,.45); pointer-events:none; z-index:5; }
  .codex { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0; }
  .codex div { background:rgba(255,255,255,.06); border-radius:10px; padding:8px 4px; text-align:center; font-size:12px; color:#cfd8c9; }
  .codex div.off { color:rgba(255,255,255,.3); }
  .codex div.on { color:#f3f0e6; border:1px solid rgba(233,217,140,.35); }
  @media (prefers-reduced-motion: reduce) { .panel { transition:none; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="toast"></div>
<div id="kbHint" hidden>Space: 물주기 · 드래그: 합성</div>

<div id="menu" class="panel show">
  <h1>이슬 정원</h1>
  <p class="sub">같은 식물 3개를 끌어다 합쳐 보세요. 큰 식물일수록 금화를 많이 냅니다.</p>
  <button id="startBtn" class="big">정원 가꾸기</button>
  <button id="loadBtn" class="ghost" style="width:100%; margin-top:10px">다른 기기 기록 불러오기</button>
  <div id="loadBox" class="hide">
    <div class="row"><input id="loadNick" maxlength="12" placeholder="닉네임" aria-label="닉네임"><input id="loadPin" maxlength="4" inputmode="numeric" placeholder="PIN 4자리" aria-label="PIN"></div>
    <div class="row"><button id="loadGo" class="ghost" style="width:100%">불러오기</button></div>
    <div id="loadMsg" class="msg"></div>
  </div>
</div>

<div id="offline" class="panel">
  <h1 style="font-size:24px">돌아오셨군요</h1>
  <p id="offTime" class="sub"></p>
  <div class="stat"><span>자란 금화</span><b id="offGain">0</b></div>
  <div class="stat"><span>떨어진 씨앗</span><b id="offSeeds">0</b></div>
  <p id="offNote" class="msg"></p>
  <button id="offBtn" class="big">정원으로</button>
</div>

<div id="log" class="panel">
  <h1 style="font-size:24px">정원 일지</h1>
  <div class="stat"><span>누적 금화</span><b id="lgCum">0</b></div>
  <div class="stat"><span>가장 큰 식물</span><b id="lgMax">-</b></div>
  <div class="stat"><span>물 준 횟수</span><b id="lgTaps">0</b></div>
  <div id="codex" class="codex"></div>
  <p class="sub" style="margin-top:12px">기록을 서버에 남기면 다른 기기에서도 이어서 가꿀 수 있어요.</p>
  <div class="row"><input id="nick" maxlength="12" placeholder="닉네임" aria-label="닉네임"><input id="pin" maxlength="4" inputmode="numeric" placeholder="PIN 4자리" aria-label="PIN"></div>
  <div class="row"><button id="cloudBtn" class="ghost" style="width:100%">서버에 저장</button></div>
  <div id="cloudMsg" class="msg"></div>
  <button id="logClose" class="big">정원으로</button>
</div>

<script>
// ───────── 설정 ─────────
const SLUG = 'merge-garden', SAVE_KEY = 'wk_' + SLUG, BALANCE = 1;
const SB_URL = 'https://fpjgjwazqpfiffnsgume.supabase.co', SB_KEY = 'sb_publishable_I1YgcnYNBOaGy0WwozO2wQ_PGwsLtU5';
const sbHeaders = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
function logEvent(event, score = null) { try { fetch(SB_URL + '/rest/v1/play_events', { method:'POST', headers:sbHeaders, keepalive:true, body:JSON.stringify({ game_id:SLUG, event, score }) }).catch(() => {}); } catch (e) {} }
async function sha256(str) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

// 경제 상수 — docs/03-merge-garden/sim/idle-sim.mjs 와 동일 (게이트 A 통과값)
const C = { COLS:5, ROWS:6, GRID0:12, GRID_MAX:30, GRID_C0:60, GRID_G:1.8, DROP_P0:6, WATER_C0:12, WATER_G:1.3, WATER_MUL:.92, WATER_MAX:20,
  SEED_TIER_C:[0, 600, 6000, 60000, 600000], TAP_CD:2, GOLD0:.05, GOLD_MUL:3.3, PRESTIGE_T:400000, PRESTIGE_BONUS:.2, OFF_RATE:.5, OFF_CAP:8*3600 };
const NAMES = ['씨앗','새싹','풀잎','꽃봉오리','들꽃','관목','어린나무','큰나무','꽃나무','고목','신목','세계수'];
const tierName = L => L <= NAMES.length ? NAMES[L-1] : `세계수 ${'ⅠⅡⅢⅣⅤⅥⅦⅧⅨ'[Math.min(8, L - NAMES.length - 1)]}`;
const goldOf = L => C.GOLD0 * Math.pow(C.GOLD_MUL, L - 1);
const gridCost = () => C.GRID_C0 * Math.pow(C.GRID_G, S.grid - C.GRID0);
const waterCost = () => C.WATER_C0 * Math.pow(C.WATER_G, S.water);
const seedCost = () => C.SEED_TIER_C[S.seedTier] || 0;
const period = () => C.DROP_P0 * Math.pow(C.WATER_MUL, S.water);
const mult = () => 1 + C.PRESTIGE_BONUS * S.dew;   // applyMeta(): 챌린지에서는 0 강제 (M2)
const fmt = n => n < 1000 ? (n < 10 ? n.toFixed(1) : Math.floor(n).toLocaleString()) : n < 1e6 ? (n/1e3).toFixed(n < 1e4 ? 2 : 1) + 'K' : n < 1e9 ? (n/1e6).toFixed(2) + 'M' : n < 1e12 ? (n/1e9).toFixed(2) + 'B' : (n/1e12).toFixed(2) + 'T';

// 해금 순서: 중심에서 가까운 칸부터 (5×6)
const UNLOCK = (() => { const a = []; for (let r = 0; r < C.ROWS; r++) for (let c = 0; c < C.COLS; c++) a.push({ i: r*C.COLS+c, d: Math.hypot(c-2, r-2.5) + (r > 2.5 ? .01 : 0) + c*.001 }); return a.sort((x,y) => x.d-y.d).map(x => x.i); })();
const openIdx = () => UNLOCK.slice(0, S.grid);
const isOpen = i => UNLOCK.indexOf(i) < S.grid;

// ───────── 상태 ─────────
const S = { mode:'menu', cells:new Array(30).fill(0), grid:12, water:0, seedTier:1, gold:0, cum:0, cumAll:0, dew:0, season:0, codex:[], taps:0, merges:0, maxTier:0,
  dropAcc:0, tapCd:0, t:0, lastSeen:0, shopSeen:false, logSeen:false, chal:null };
const P = [], FL = [], SPR = []; // 파티클, 떠오르는 글자, 스프링(칸 스쿼시)
let shake = 0, punch = 0, dust = Array.from({length:22}, () => ({ x:Math.random(), y:Math.random(), s:Math.random()*1.6+.6, v:Math.random()*.012+.006, p:Math.random()*6.28 }));

// ───────── 캔버스·레이아웃 ─────────
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 390, H = 844, DPR = 1, L = {};
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const sat = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0;
  const sab = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sab')) || 0;
  const hudH = 64 + sat, shopH = 108, canH = 72, gap = 12;
  const gw = Math.min(W - 24, 420), avail = H - hudH - sab - 12 - shopH - canH - gap * 3;
  const cell = Math.floor(Math.min(gw / C.COLS, avail / C.ROWS)), block = cell * C.ROWS + gap + canH + gap + shopH;
  const free = Math.max(0, H - hudH - sab - 12 - block), gy = hudH + 12 + free * .45, gx = (W - cell * C.COLS) / 2;
  L = { sat, sab, hudH, cell, gx, gy, gridH: cell * C.ROWS, canY: gy + cell * C.ROWS + gap, canH, shopY: gy + cell * C.ROWS + gap + canH + gap, shopH };
}
addEventListener('resize', resize); resize();
const cellXY = i => ({ x: L.gx + (i % C.COLS) * L.cell, y: L.gy + Math.floor(i / C.COLS) * L.cell });
const cellAt = (px, py) => { const c = Math.floor((px - L.gx) / L.cell), r = Math.floor((py - L.gy) / L.cell); return c >= 0 && c < C.COLS && r >= 0 && r < C.ROWS ? r * C.COLS + c : -1; };

// ───────── 사운드 ─────────
let AC = null;
function audio() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e) {} }
function tone(f, t, type = 'sine', vol = .08, slide = 0) { try { if (!AC) return; const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), AC.currentTime + t); g.gain.setValueAtTime(vol, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + t); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + t); } catch(e) {} }
function noise(t, vol = .06, f = 1200) { try { if (!AC) return; const n = AC.sampleRate * t, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * (1 - i/n); const s = AC.createBufferSource(); s.buffer = b; const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = .8; const g = AC.createGain(); g.gain.value = vol; s.connect(bp); bp.connect(g); g.connect(AC.destination); s.start(); } catch(e) {} }
const SND = {
  start() { tone(392, .25, 'triangle', .07); setTimeout(() => tone(523, .3, 'triangle', .07), 120); setTimeout(() => tone(659, .45, 'triangle', .06), 240); },
  water() { noise(.18, .05, 900); tone(220, .12, 'sine', .03, -80); },
  merge(L) { const f = 330 * Math.pow(1.06, Math.min(24, L * 2)); tone(f, .18, 'triangle', .07); setTimeout(() => tone(f * 1.5, .25, 'sine', .06), 70); },
  buy() { tone(880, .08, 'square', .04); setTimeout(() => tone(1320, .14, 'square', .035), 60); },
  discover() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .35, 'sine', .05), i * 90)); },
  drop() { tone(600, .06, 'sine', .025, -300); },
  bad() { tone(160, .18, 'sawtooth', .04, -60); },
};

// ───────── 식물 그리기 ─────────
const SEASONS = [
  { name:'봄', sky:['#2b4a3a','#1a2a1f'], soil:'#3d2e22', soil2:'#4b3a2b', grass:'#4f8a4a', leaf:['#7fd16b','#3f8a3a','#245a2a'], flower:'#f29fc5', trunk:['#8a5b3a','#5a3a22'] },
  { name:'여름', sky:['#1f4a4a','#14262a'], soil:'#3a2c20', soil2:'#473527', grass:'#3f8f46', leaf:['#6fd66a','#2f8a3a','#1d5a2a'], flower:'#ffd166', trunk:['#86573a','#54371f'] },
  { name:'가을', sky:['#4a3a2a','#261a14'], soil:'#3f2c1f', soil2:'#4d3827', grass:'#9a7a3a', leaf:['#f2b35a','#d06a2a','#8a3a1a'], flower:'#ff8f6b', trunk:['#7a4f30','#4e3018'] },
  { name:'겨울', sky:['#2a3a4a','#141c26'], soil:'#2f2a2a', soil2:'#3b3535', grass:'#7a8a8f', leaf:['#bfe2e6','#7fb0ba','#4a7a86'], flower:'#e6f2ff', trunk:['#6a5a4a','#3e3328'] },
];
const season = () => SEASONS[S.season % 4];
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r); ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath(); }
function leafBlob(x, y, rx, ry, col, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  const g = ctx.createRadialGradient(-rx*.35, -ry*.4, 1, 0, 0, Math.max(rx, ry)); g.addColorStop(0, col[0]); g.addColorStop(.6, col[1]); g.addColorStop(1, col[2]);
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, 6.283); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.beginPath(); ctx.moveTo(0, ry*.7); ctx.lineTo(0, -ry*.7); ctx.stroke();
  ctx.restore();
}
function drawPlant(L, x, y, s, t, hi) {
  // x,y = 칸 바닥 중앙, s = 칸 크기, t = 시간(흔들림), hi = 강조
  const se = season(), sw = Math.sin(t * 1.6 + x * .05) * .04, u = s / 56;
  ctx.save(); ctx.translate(x, y); ctx.scale(u, u); ctx.rotate(sw * Math.min(L, 6) / 6);
  if (hi) { ctx.shadowColor = 'rgba(233,217,140,.8)'; ctx.shadowBlur = 14; }
  const lf = se.leaf, tr = se.trunk;
  if (L === 1) { // 씨앗
    const g = ctx.createRadialGradient(-2, -8, 1, 0, -6, 9); g.addColorStop(0, '#c9a66b'); g.addColorStop(1, '#6b4a26');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, -7, 7, 9, .3, 0, 6.283); ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.beginPath(); ctx.moveTo(-2, -13); ctx.quadraticCurveTo(2, -8, -1, -1); ctx.stroke();
  } else if (L === 2) { // 새싹
    ctx.strokeStyle = lf[1]; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(1, -8, 0, -14); ctx.stroke();
    leafBlob(-6, -12, 7, 4, lf, -.6); leafBlob(6, -14, 7, 4, lf, .6);
  } else if (L === 3) { // 풀잎
    ctx.strokeStyle = lf[1]; ctx.lineWidth = 2; for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i*4, 0); ctx.quadraticCurveTo(i*7, -12, i*5, -22 - Math.abs(i)*-3); ctx.stroke(); }
    leafBlob(0, -14, 14, 9, lf); leafBlob(-9, -8, 8, 5, lf, -.5); leafBlob(9, -8, 8, 5, lf, .5);
  } else if (L === 4) { // 꽃봉오리
    ctx.strokeStyle = lf[1]; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(2, -12, 0, -22); ctx.stroke();
    leafBlob(-8, -8, 9, 5, lf, -.7); leafBlob(8, -10, 9, 5, lf, .7);
    const g = ctx.createRadialGradient(-2, -28, 1, 0, -26, 8); g.addColorStop(0, '#fff'); g.addColorStop(.3, se.flower); g.addColorStop(1, '#8a4a6a');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, -26, 6, 8, 0, 0, 6.283); ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1; ctx.stroke();
  } else if (L === 5) { // 들꽃
    ctx.strokeStyle = lf[1]; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(2, -12, 0, -24); ctx.stroke();
    leafBlob(-9, -9, 10, 5, lf, -.6); leafBlob(9, -11, 10, 5, lf, .6);
    for (let i = 0; i < 6; i++) { const a = i / 6 * 6.283 + t * .3; const g = ctx.createRadialGradient(0, 0, 0, Math.cos(a)*7, -27 + Math.sin(a)*7, 6); g.addColorStop(0, '#fff'); g.addColorStop(1, se.flower); ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(Math.cos(a)*7, -27 + Math.sin(a)*7, 5, 3.5, a, 0, 6.283); ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = .8; ctx.stroke(); }
    ctx.fillStyle = '#f2c94c'; ctx.beginPath(); ctx.arc(0, -27, 3.5, 0, 6.283); ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.stroke();
  } else { // 6+ 나무류
    const sz = Math.min(1.55, .8 + (L - 6) * .12), th = 18 * sz + 8, tw = 3 + L * .4;
    const g = ctx.createLinearGradient(-tw, 0, tw, 0); g.addColorStop(0, tr[1]); g.addColorStop(.4, tr[0]); g.addColorStop(1, tr[1]);
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-tw, 0); ctx.quadraticCurveTo(-tw*.6, -th*.5, -tw*.5, -th); ctx.lineTo(tw*.5, -th); ctx.quadraticCurveTo(tw*.6, -th*.5, tw, 0); ctx.closePath(); ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.moveTo(-1, -2); ctx.lineTo(-1, -th*.7); ctx.stroke();
    if (L === 6) { leafBlob(-8, -th-2, 9, 8, lf, -.3); leafBlob(8, -th-2, 9, 8, lf, .3); leafBlob(0, -th-8, 10, 8, lf); }
    else {
      const R = 13 * sz; leafBlob(-R*.8, -th-R*.4, R*.9, R*.75, lf, -.3); leafBlob(R*.8, -th-R*.4, R*.9, R*.75, lf, .3); leafBlob(0, -th-R*.9, R, R*.85, lf);
      if (L === 7) {} else if (L === 8) { leafBlob(0, -th-R*1.6, R*.8, R*.6, lf); }
      else if (L === 9) { for (let i = 0; i < 7; i++) { const a = i*1.7 + .4; ctx.fillStyle = se.flower; ctx.beginPath(); ctx.arc(Math.cos(a)*R*.9, -th-R*.8 + Math.sin(a)*R*.7, 2.6, 0, 6.283); ctx.fill(); } }
      else { // 10+ 고목·신목·세계수 — 빛나는 잎·후광

}
function openLog() {
  S.mode = 'log'; document.getElementById('lgCum').textContent = fmt(S.cumAll) + ' G'; document.getElementById('lgMax').textContent = S.maxTier ? tierName(S.maxTier) : '-'; document.getElementById('lgTaps').textContent = S.taps;
  const mx = Math.max(12, S.maxTier); document.getElementById('codex').innerHTML = Array.from({length: mx}, (_, k) => k + 1).map(Lv => `<div class="${S.codex.includes(Lv) ? 'on' : 'off'}">${S.codex.includes(Lv) ? tierName(Lv) : '???'}</div>`).join('');
  const nick = store.get('mg-nick'); if (nick) { document.getElementById('nick').value = nick; document.getElementById('cloudMsg').textContent = store.get('mg-pinhash') ? `「${nick}」로 30초마다 자동 저장 중` : ''; }
  show('log', true);
}
document.getElementById('logClose').addEventListener('click', () => { show('log', false); S.mode = 'play'; });
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('offBtn').addEventListener('click', () => { show('offline', false); S.mode = 'play'; });
function showOffline(o) {
  const h = Math.floor(o.el / 3600), m = Math.floor(o.el % 3600 / 60);
  document.getElementById('offTime').textContent = (h ? h + '시간 ' : '') + m + '분 동안 정원이 자랐어요'; document.getElementById('offGain').textContent = fmt(o.gain) + ' G'; document.getElementById('offSeeds').textContent = o.seeds + '개';
  document.getElementById('offNote').textContent = `오프라인 수익 ${Math.round(C.OFF_RATE * 100)}% · 최대 8시간`; S.mode = 'log'; show('offline', true);
}

// ───────── 세이브 ─────────
function snapshot() { return { v:1, balance:BALANCE, cells:S.cells, grid:S.grid, water:S.water, seedTier:S.seedTier, gold:S.gold, cum:S.cum, cumAll:S.cumAll, dew:S.dew, season:S.season, codex:S.codex, taps:S.taps, merges:S.merges, maxTier:S.maxTier, t:S.t, shopSeen:S.shopSeen, logSeen:S.logSeen, askedCloud:S.askedCloud, firstGrid:S.firstGrid, lastSeen:Date.now() }; }
function save() { if (S.chal || S.mode === 'menu') return; store.set(SAVE_KEY, JSON.stringify(snapshot())); cloudSave(); }
function load() { try { const j = JSON.parse(store.get(SAVE_KEY) || 'null'); if (!j || j.v !== 1) return null; if (j.balance !== BALANCE) { store.set(SAVE_KEY + '-old', JSON.stringify(j)); return null; } return j; } catch(e) { return null; } }
function applySave(j) { for (const k of ['grid','water','seedTier','gold','cum','cumAll','dew','season','taps','merges','maxTier','t','shopSeen','logSeen','askedCloud','firstGrid']) if (j[k] != null) S[k] = j[k]; S.cells = Array.from({length:30}, (_, i) => j.cells?.[i] || 0); S.codex = j.codex || [1]; S.lastSeen = j.lastSeen || Date.now(); }
function offlineGain(j) {
  const el = Math.min(C.OFF_CAP, (Date.now() - (j.lastSeen || Date.now())) / 1000); if (el < 60) return null;
  const gain = prodPerSec() * el * C.OFF_RATE; let seeds = 0; const n = Math.floor(el * mult() / period());
  for (let k = 0; k < n; k++) { if (addSeed(S.seedTier, -1, true) < 0) break; seeds++; }
  S.gold += gain; S.cum += gain; S.cumAll += gain; return { el, gain, seeds };
}
let cloudLast = 0, cloudBusy = false;
async function cloudSave(force) {
  const nick = store.get('mg-nick'), hash = store.get('mg-pinhash'); if (!nick || !hash || cloudBusy) return;
  if (!force && Date.now() - cloudLast < 30000) return; cloudBusy = true;
  try { const r = await fetch(`${SB_URL}/rest/v1/rpc/weekly_save`, { method:'POST', headers:sbHeaders, keepalive:true, body:JSON.stringify({ p_game_id:SLUG, p_player:nick, p_pin_hash:hash, p_data:snapshot(), p_runs:S.season || 0 }) });
    const res = await r.json(); cloudLast = Date.now(); if (res === 'wrong_pin') { store.set('mg-pinhash', ''); toast('PIN이 달라 서버 저장이 꺼졌어요 — 일지에서 다시 등록'); } return res; }
  catch(e) { return null; } finally { cloudBusy = false; }
}
async function registerCloud() {
  const nick = document.getElementById('nick').value.trim(), pin = document.getElementById('pin').value.trim(), msg = document.getElementById('cloudMsg');
  if (!nick) { msg.textContent = '닉네임을 적어주세요'; return; } if (!/^\d{4}$/.test(pin)) { msg.textContent = 'PIN은 숫자 4자리'; return; }
  store.set('mg-nick', nick); store.set('mg-pinhash', await sha256(pin + ':' + SLUG)); msg.textContent = '저장 중…';
  const res = await cloudSave(true);
  msg.textContent = res === 'created' ? '서버에 새로 저장했어요 — 이제 30초마다 자동 저장' : res === 'saved' ? '서버 기록을 갱신했어요' : res === 'wrong_pin' ? '그 닉네임은 다른 PIN으로 등록돼 있어요' : '서버에 연결할 수 없어요';
}
async function loadCloud() {
  const nick = document.getElementById('loadNick').value.trim(), pin = document.getElementById('loadPin').value.trim(), msg = document.getElementById('loadMsg');
  if (!nick || !/^\d{4}$/.test(pin)) { msg.textContent = '닉네임과 PIN 4자리를 적어주세요'; return; } msg.textContent = '불러오는 중…';
  try { const hash = await sha256(pin + ':' + SLUG);
    const r = await fetch(`${SB_URL}/rest/v1/rpc/weekly_load`, { method:'POST', headers:sbHeaders, body:JSON.stringify({ p_game_id:SLUG, p_player:nick, p_pin_hash:hash }) }); const rows = await r.json();
    if (!rows.length) { msg.textContent = '기록이 없거나 PIN이 달라요'; return; }
    const j = rows[0].data; j.balance = BALANCE; j.lastSeen = j.lastSeen || Date.now(); store.set(SAVE_KEY, JSON.stringify(j)); store.set('mg-nick', nick); store.set('mg-pinhash', hash);
    msg.textContent = '가져왔어요'; document.getElementById('startBtn').textContent = '이어서 가꾸기'; document.getElementById('loadBox').classList.add('hide');
  } catch(e) { msg.textContent = '서버에 연결할 수 없어요'; }
}
document.getElementById('cloudBtn').addEventListener('click', registerCloud);
document.getElementById('loadBtn').addEventListener('click', () => document.getElementById('loadBox').classList.toggle('hide'));
document.getElementById('loadGo').addEventListener('click', loadCloud);
setInterval(() => { if (S.mode === 'play') save(); }, 30000);
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (S.mode !== 'menu') { save(); cloudSave(true); logEvent('over', Math.floor(S.cumAll)); } hiddenAt = Date.now(); } else if (hiddenAt && S.mode === 'play') { const el = (Date.now() - hiddenAt) / 1000; hiddenAt = 0; if (el > 1) catchUp(el); } });
let hiddenAt = 0;
function catchUp(el) { // 화면 이탈 중 rAF 정지분 벽시계 적립: 60초 이하 만근, 초과분은 오프라인 요율
  const a = Math.min(60, el), b = Math.min(C.OFF_CAP, el - a);
  const g = prodPerSec() * (a + b * C.OFF_RATE); S.gold += g; S.cum += g; S.cumAll += g;
  const n = Math.floor((a + b) * mult() / period()); for (let k = 0; k < n; k++) if (addSeed(S.seedTier, -1, true) < 0) break;
  if (g > 1) toast(`자리를 비운 동안 +${fmt(g)} G`);
}

// ───────── 루프 ─────────
if (load()) document.getElementById('startBtn').textContent = '이어서 가꾸기';
logEvent('load');
function frame(ts) { const dt = Math.min(.1, (ts - last) / 1000 || 0); last = ts; if (S.mode === 'play') tick(dt); fx(dt); draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
if (/[?&]test=1/.test(location.search)) window.GAME = { S, C, L: () => L, tick, addSeed, tryMerge, water, buy, startGame, save, load, snapshot, prodPerSec, UNLOCK, cellXY, offlineGain, applySave, openLog };
</script>
</body>
