<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>밤의 퇴마사</title>
<style>
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height:100%; overflow:hidden; background:#0b0f1a; }
  body { font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; color:#f1ead8; word-break: keep-all; touch-action:none; overscroll-behavior:none; user-select:none; -webkit-user-select:none; }
  #cv { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .hide { display:none !important; }
  .panel { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%) translateY(12px); width:min(92vw, 400px); background:rgba(14,18,30,.95); border:1px solid rgba(255,255,255,.12); border-radius:20px; padding:24px; opacity:0; pointer-events:none; transition: opacity .25s ease-out, transform .25s ease-out; z-index:20; }
  .panel.show { opacity:1; pointer-events:auto; transform:translate(-50%,-50%); }
  h1 { font-size:34px; letter-spacing:-1px; margin-bottom:8px; }
  .sub { font-size:14px; color:#c9c3b4; line-height:1.5; margin-bottom:16px; }
  button { font: inherit; color:#1a1408; background:#e8c15a; border:0; border-radius:16px; min-height:48px; padding:0 24px; font-size:17px; font-weight:700; cursor:pointer; box-shadow:0 4px 0 #9a7a22; transition: transform .1s, box-shadow .1s; }
  button:active { transform: translateY(2px) scale(.98); box-shadow:0 2px 0 #9a7a22; }
  button.ghost { background:transparent; color:#e8c15a; box-shadow:none; border:1px solid rgba(232,193,90,.4); min-height:44px; font-size:14px; font-weight:600; }
  button:focus-visible, input:focus-visible { outline:3px solid #4da3ff !important; outline-offset:2px; }
  .big { width:100%; min-height:56px; font-size:19px; margin-top:8px; }
  .row { display:flex; gap:8px; margin-top:12px; }
  input { font:inherit; font-size:16px; min-height:44px; padding:0 12px; border-radius:12px; border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.3); color:#fff; width:100%; }
  .msg { font-size:13px; color:#c9c3b4; min-height:18px; margin-top:8px; }
  .stat { display:flex; justify-content:space-between; font-size:15px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.08); }
  .stat b { color:#e8c15a; }
  #toast { position:fixed; left:50%; top:calc(var(--sat) + 92px); transform:translateX(-50%) scale(.9); background:rgba(10,14,24,.92); border:1px solid rgba(232,193,90,.35); color:#f1ead8; padding:10px 16px; border-radius:12px; font-size:14px; opacity:0; transition: opacity .15s, transform .15s; pointer-events:none; z-index:30; max-width:86vw; text-align:center; }
  #toast.show { opacity:1; transform:translateX(-50%) scale(1); }
  #kbHint { position:fixed; bottom:calc(var(--sab) + 6px); left:0; right:0; text-align:center; font-size:11px; color:rgba(255,255,255,.45); pointer-events:none; z-index:5; }
  /* 레벨업 3택1 */
  #lv { padding:16px; }
  #lv h2 { font-size:20px; text-align:center; margin-bottom:12px; color:#e8c15a; }
  .card { display:flex; gap:12px; align-items:center; width:100%; text-align:left; background:rgba(255,255,255,.06); color:#f1ead8; border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:12px; min-height:72px; margin-top:8px; box-shadow:none; font-weight:500; }
  .card:active { transform:scale(.98); box-shadow:none; }
  .card .ic { width:44px; height:44px; flex:0 0 44px; }
  .card b { display:block; font-size:16px; } .card small { font-size:12px; color:#c9c3b4; line-height:1.4; }
  .card .lvl { margin-left:auto; font-size:12px; color:#e8c15a; white-space:nowrap; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; } .tabs button { flex:1; min-height:40px; font-size:13px; padding:0 4px; } .tabs button.on { background:rgba(232,193,90,.22); }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; } .grid .w { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:8px 4px; text-align:center; font-size:12px; color:#f1ead8; min-height:72px; box-shadow:none; font-weight:500; }
  .grid .w.in { border-color:#e8c15a; background:rgba(232,193,90,.18); } .grid .w.off { opacity:.35; } .grid .w small { display:block; font-size:10px; color:#c9c3b4; margin-top:2px; } .grid .w canvas { width:28px; height:28px; display:block; margin:0 auto 2px; }
  .el-fire { color:#ff7a4a } .el-water { color:#5fc8ff } .el-wood { color:#7fe06a } .el-metal { color:#d8d8e8 } .el-none { color:#c9c3b4 }
  #shrine { max-height:88vh; overflow-y:auto; } .big.sm { min-height:44px; font-size:15px; margin-top:8px; }
  .rank { font-size:13px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.08); display:flex; justify-content:space-between; }
  @media (prefers-reduced-motion: reduce) { .panel { transition:none; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="toast"></div>
<div id="kbHint" hidden>WASD / 방향키: 이동</div>

<div id="menu" class="panel show">
  <h1>밤의 퇴마사</h1>
  <p class="sub">움직이기만 하세요. 공격은 알아서 합니다. 동이 틀 때까지 10분.</p>
  <div id="stages" class="row" style="margin:0 0 4px"></div>
  <button id="startBtn" class="big">밤으로 나서기</button>
  <div class="row"><button id="shrineBtn" class="ghost hide" style="flex:1">사당</button><button id="chalBtn" class="ghost hide" style="flex:1">주간 챌린지</button></div>
  <p id="menuBest" class="msg" style="text-align:center"></p>
</div>

<div id="shrine" class="panel">
  <h1 style="font-size:24px">사당</h1>
  <p id="shWallet" class="msg" style="margin:0 0 10px"></p>
  <div class="tabs"><button id="tabTrain" class="ghost on">수련</button><button id="tabGacha" class="ghost">뽑기</button><button id="tabDeck" class="ghost">덱</button><button id="tabCodex" class="ghost">도감</button></div>
  <div id="shBody"></div>
  <button id="shClose" class="big">닫기</button>
</div>

<div id="chal" class="panel">
  <h1 style="font-size:24px">주간 챌린지</h1>
  <p id="chalDesc" class="sub"></p>
  <div id="chalTop"></div>
  <div class="row"><input id="chalNick" maxlength="12" placeholder="닉네임" aria-label="닉네임"></div>
  <button id="chalGo" class="big">도전</button>
  <button id="chalClose" class="ghost" style="width:100%; margin-top:8px">닫기</button>
</div>

<div id="lv" class="panel">
  <h2>수련의 성과</h2>
  <div id="lvCards"></div>
</div>

<div id="chest" class="panel">
  <h2 id="chTitle" style="font-size:22px; text-align:center; margin-bottom:12px">상자</h2>
  <div id="chList"></div>
  <button id="chBtn" class="big">계속</button>
</div>

<div id="over" class="panel">
  <h1 id="ovTitle" style="font-size:26px">쓰러졌다</h1>
  <p id="ovSub" class="sub"></p>
  <div class="stat"><span>버틴 시간</span><b id="ovTime">0:00</b></div>
  <div class="stat"><span>처치</span><b id="ovKills">0</b></div>
  <div class="stat"><span>도달 레벨</span><b id="ovLvl">1</b></div>
  <div class="stat"><span>엽전</span><b id="ovCoins">+0</b></div>
  <p id="ovBest" class="msg"></p>
  <div id="regBox" class="hide">
    <p class="sub" style="margin:12px 0 0">기록을 남기면 다른 기기에서도 이어집니다.</p>
    <div class="row"><input id="nick" maxlength="12" placeholder="닉네임" aria-label="닉네임"><input id="pin" maxlength="4" inputmode="numeric" placeholder="PIN 4자리" aria-label="PIN"></div>
    <div class="row"><button id="cloudBtn" class="ghost" style="width:100%">서버에 저장</button></div>
    <div id="cloudMsg" class="msg"></div>
  </div>
  <button id="againBtn" class="big">다시 밤으로</button>
  <button id="homeBtn" class="ghost" style="width:100%; margin-top:8px">사당·덱으로</button>
</div>

<script>
// ───────── 설정 ─────────
const SLUG = 'night-exorcist', SAVE_KEY = 'wk_' + SLUG, BALANCE = 2;
const SB_URL = 'https://fpjgjwazqpfiffnsgume.supabase.co', SB_KEY = 'sb_publishable_I1YgcnYNBOaGy0WwozO2wQ_PGwsLtU5';
const sbHeaders = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
function logEvent(event, score = null, variant = null) { try { fetch(SB_URL + '/rest/v1/play_events', { method:'POST', headers:sbHeaders, keepalive:true, body:JSON.stringify({ game_id:SLUG, event, score, variant }) }).catch(() => {}); } catch (e) {} }
// 밸런싱용 맥락: v<BAL>|s<스테이지>|<clear|dead>|lv<레벨>|k<처치>|tr<수련합>|m<숙련합>|runs<n>|chal?|d:<덱>
function runVariant(end) { const tr = Object.values(META.train).reduce((a, b) => a + b, 0), m = S.deck.reduce((a, id) => a + (META.owned[id] || 0), 0); return `v${BALANCE}|s${S.stage + 1}|${end}|lv${S.lvl}|k${S.kills}|tr${tr}|m${m}|runs${META.runs}${S.chal ? '|chal' : ''}|d:${S.deck.join(',')}`; }
async function sha256(str) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
const TEST = /[?&]test=1/.test(location.search);

// 수식 — docs/04-night-exorcist/sim/run-sim.mjs 와 동일
const C = { RUN:600, SPAWN0:1.2, SPAWN_K:.006, HP0:10, HP_G:1.0032, CAP:60, CONTACT:3, HP_PLAYER:100, REGEN:.35, LVL_XP0:12, LVL_XP_G:1.18,
  BOSS1_AT:300, BOSS1_HP:40, BOSS2_AT:540, BOSS2_HP:120, SPEED:110, PICK_R:70, META_G:1.0, META_D:.9 };
// 스테이지: els = 이 밤에 나오는 속성 3개(잡몹·정예는 스폰 시 랜덤), roster = 전용 잡몹 5, bosses = 전용 보스 2(속성 고정)
const STAGES = [
  { id:'field',  name:'달빛 초원',   mul:1.0,  ground:['#17231a','#121b15'], fog:'rgba(120,150,110,.06)', els:['fire','metal','water'], roster:['egg','fire','water','jiangshi','gumiho'],                 bosses:['boss1','boss2'],       bound:0,   obst:null },
  { id:'forest', name:'귀신의 숲',   mul:1.45, ground:['#121a16','#0c120f'], fog:'rgba(120,160,140,.12)', els:['wood','water','metal'], roster:['moonhare','maiden','owl','ginseng','treeghost'],          bosses:['whitetiger','centipede'], bound:280, obst:{ tree:.55 } },
  { id:'temple', name:'업화 폐사지', mul:1.8,  ground:['#1f1612','#140e0b'], fog:'rgba(200,120,60,.08)',  els:['fire','wood','metal'],  roster:['crowflock','flamefiend','wraith','skullmonk','stonestatue'], bosses:['phoenix','yaksha'],    bound:0,   obst:{ wall:.35, fire:.3 } },
  { id:'p4', name:'(예정)', soon:true }, { id:'p5', name:'(예정)', soon:true }, { id:'p6', name:'(예정)', soon:true },
];
const STAGES_LIVE = STAGES.filter(s => !s.soon);
const nStages = () => STAGES_LIVE.length;
const ELITE_AT = [90, 180, 270, 390, 480];   // 정예 등장 시각
const CHEST = [{ g:'일반', n:1, p:.6, col:'#c9c3b4' }, { g:'레어', n:3, p:.3, col:'#7fd1ff' }, { g:'에픽', n:5, p:.1, col:'#d08cff' }];
const ARMOR_SPD = { none:1, light:1.12, heavy:.88 };   // 방어구 타입별 이속 편차
const EL_COL = { fire:'#ff7a4a', water:'#5fc8ff', wood:'#7fe06a', metal:'#d8d8e8', none:'#f1ead8' };
const power = r => 1 + C.META_G * (1 - Math.pow(C.META_D, r));

// ───────── 메타 세이브 ─────────
const META0 = { v:2, runs:0, coins:0, shards:0, train:{ atk:0, hp:0, regen:0, spd:0, pick:0 }, owned:{ talisman:0 }, deck:['talisman'], stage:1, bestStage:0, codex:[], evo:[], best:{ time:0, kills:0 }, chalBest:0, lastSeen:0 };
function migrate(m) { if (!m) return JSON.parse(JSON.stringify(META0)); const base = JSON.parse(JSON.stringify(META0)); if (m.v === 1) { const w = m.weapons || []; m.owned = {}; if (w[0]) m.owned.talisman = 0; if (w[1]) m.owned.sword = 0; if (w[2]) m.owned.bell = 0; m.deck = Object.keys(m.owned); delete m.weapons; delete m.chars; m.v = 2; } const out = { ...base, ...m }; out.train = { ...base.train, ...(m.train || {}) }; if (!out.owned.talisman && out.owned.talisman !== 0) out.owned.talisman = 0; if (!out.deck.length) out.deck = ['talisman']; return out; }
let META = migrate(JSON.parse(store.get(SAVE_KEY) || 'null'));
function saveMeta() { META.lastSeen = Date.now(); store.set(SAVE_KEY, JSON.stringify(META)); cloudSave(); }
let cloudLast = 0, cloudBusy = false;
async function cloudSave(force) {
  const nick = store.get('ne-nick'), hash = store.get('ne-pinhash'); if (!nick || !hash || cloudBusy) return;
  if (!force && Date.now() - cloudLast < 30000) return; cloudBusy = true;
  try { const r = await fetch(`${SB_URL}/rest/v1/rpc/weekly_save`, { method:'POST', headers:sbHeaders, keepalive:true, body:JSON.stringify({ p_game_id:SLUG, p_player:nick, p_pin_hash:hash, p_data:META, p_runs:META.runs }) });
    const res = await r.json(); cloudLast = Date.now(); if (res === 'wrong_pin') { store.set('ne-pinhash', ''); toast('PIN이 달라 서버 저장이 꺼졌어요'); } return res; }
  catch(e) { return null; } finally { cloudBusy = false; }
}
async function registerCloud() {
  const nick = document.getElementById('nick').value.trim(), pin = document.getElementById('pin').value.trim(), msg = document.getElementById('cloudMsg');
  if (!nick) { msg.textContent = '닉네임을 적어주세요'; return; } if (!/^\d{4}$/.test(pin)) { msg.textContent = 'PIN은 숫자 4자리'; return; }
  store.set('ne-nick', nick); store.set('ne-pinhash', await sha256(pin + ':' + SLUG)); msg.textContent = '저장 중…';
  const res = await cloudSave(true);
  msg.textContent = res === 'created' ? '서버에 새로 저장했어요' : res === 'saved' ? '서버 기록을 갱신했어요' : res === 'wrong_pin' ? '그 닉네임은 다른 PIN으로 등록돼 있어요' : '서버에 연결할 수 없어요';
}
document.getElementById('cloudBtn').addEventListener('click', registerCloud);

// ───────── 캔버스 ─────────
const cv = document.getElementById('cv'), ctx = cv.getContext('2d', { alpha:false });
let W = 390, H = 844, DPR = 1, SAT = 0, SAB = 0;
function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SAT = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat')) || 0; SAB = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sab')) || 0; }
addEventListener('resize', resize); resize();

// ───────── 사운드 ─────────
let AC = null;
function audio() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e) {} }
function tone(f, t, type = 'sine', vol = .08, slide = 0) { try { if (!AC) return; const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.value = f; if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), AC.currentTime + t); g.gain.setValueAtTime(vol, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + t); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + t); } catch(e) {} }
function noise(t, vol = .06, f = 1200) { try { if (!AC) return; const n = AC.sampleRate * t, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0); for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * (1 - i/n); const s = AC.createBufferSource(); s.buffer = b; const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = .9; const g = AC.createGain(); g.gain.value = vol; s.connect(bp); bp.connect(g); g.connect(AC.destination); s.start(); } catch(e) {} }
let sndT = 0;
const SND = {
  start() { tone(196, .5, 'sine', .07); setTimeout(() => tone(147, .8, 'sine', .07), 250); setTimeout(() => noise(.6, .04, 400), 100); },
  kill() { const now = performance.now(); if (now - sndT < 45) return; sndT = now; noise(.07, .035, 2200); },
  talisman() { tone(1200, .06, 'square', .02, -400); },
  sword() { noise(.12, .05, 900); tone(300, .08, 'sine', .03, -120); },
  bell() { const now = performance.now(); if (now - (SND._bellT || 0) < 2000) return; SND._bellT = now; tone(392, .5, 'sine', .03); tone(588, .4, 'sine', .012); },
  hurt() { tone(110, .15, 'sawtooth', .05, -40); },
  levelup() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .3, 'triangle', .06), i * 80)); },
  boss() { tone(65, 1.2, 'sawtooth', .07, -20); noise(.8, .05, 200); },
  gem() { const now = performance.now(); if (now - sndT < 60) return; sndT = now; tone(900 + Math.random()*200, .05, 'sine', .02, 300); },
  death() { tone(220, .6, 'sawtooth', .06, -160); setTimeout(() => tone(110, 1, 'sine', .06, -60), 200); },
  dawn() { [392, 494, 587, 784].forEach((f, i) => setTimeout(() => tone(f, .7, 'triangle', .06), i * 160)); },
};

// ───────── 데이터: 적·무기·패시브 ─────────
const ENEMY = {
  // armor: 방어구(none 보통 / light 가벼움·빠름 / heavy 무거움·느림). 속성은 스테이지 els 중 스폰 시 랜덤 — 보스만 el 고정
  // spr: 스프라이트 그리드 · anim: walk(좌우 반전 보행) / float(둥실) / hop(강시) / flicker(빠른 깜빡임) · sc: 배율
  // ── 달빛 초원
  egg:        { name:'달걀귀신', hp:1.0, spd:74,  r:11, xp:1, from:0,   armor:'none',  spr:'egg',      anim:'walk' },
  fire:       { name:'도깨비불', hp:0.5, spd:125, r:9,  xp:1, from:60,  armor:'light', spr:'fire',     anim:'flicker' },
  water:      { name:'물귀신',   hp:1.6, spd:92,  r:12, xp:2, from:90,  armor:'none',  spr:'water',    anim:'float' },
  jiangshi:   { name:'강시',     hp:2.6, spd:84,  r:13, xp:3, from:150, armor:'heavy', spr:'jiangshi', anim:'hop', hop:true },
  gumiho:     { name:'구미호',   hp:3.5, spd:108, r:14, xp:4, from:200, armor:'light', spr:'gumiho',   anim:'walk' },
  boss1:      { name:'두억시니', hp:C.BOSS1_HP, spd:70, r:30, xp:40,  boss:true, el:'fire',  armor:'heavy', patterns:['dash','shoot'], spr:'boss1', sc:1.6 },
  boss2:      { name:'이무기',   hp:C.BOSS2_HP, spd:80, r:38, xp:120, boss:true, el:'water', armor:'none',  patterns:['dash','pool'],  spr:'boss2', sc:2.0 },
  // ── 귀신의 숲
  moonhare:   { name:'달토끼 혼령', hp:0.8, spd:118, r:10, xp:1, from:0,   armor:'light', spr:'moonhare',  anim:'walk' },
  maiden:     { name:'처녀귀신',   hp:1.4, spd:80,  r:12, xp:2, from:40,  armor:'none',  spr:'maiden',    anim:'float' },
  owl:        { name:'부엉귀',     hp:0.9, spd:130, r:10, xp:1, from:90,  armor:'light', spr:'owl',       anim:'flicker' },
  ginseng:    { name:'산삼 정령',  hp:2.2, spd:62,  r:12, xp:4, from:140, armor:'none',  spr:'ginseng',   anim:'walk' },

function updatePlayer(dt) {
  const v = inputVec(); P.moving = v.x || v.y; const spd = P.spd * (S.slowT > 0 ? .65 : 1); if (P.moving) { P.x += v.x * spd * dt; P.y += v.y * spd * dt; P.dx = v.x; P.dy = v.y; P.walk += dt * 9; }
  collideObst(P); const st = STAGES[S.stage]; if (st.bound) P.y = Math.max(-st.bound + P.r, Math.min(st.bound - P.r, P.y));
  for (const b of nearObst(P.x, P.y)) if (b.hazard && Math.hypot(P.x - b.x, P.y - b.y) < b.r) { S.hp -= 6 * dt * dmgTaken(); S.hitT = .15; S.burnT = Math.max(S.burnT, .5); }
  if (S.burnT > 0) { S.burnT -= dt; S.hp -= 1.2 * dt * dmgTaken(); if (Math.random() < dt * 8) burst(P.x + (Math.random()-.5)*10, P.y - 10, 1, '#ff9a4a', 40); } if (S.slowT > 0) S.slowT -= dt;
  S.hp = Math.min(S.maxhp, S.hp + C.REGEN * mRegen() * dt); if (S.hitT > 0) S.hitT -= dt;
  cam.x += (P.x - cam.x) * Math.min(1, dt * 8); cam.y += (P.y - cam.y) * Math.min(1, dt * 8);
}

}

}

function gacha() { if (META.shards < GACHA_COST) return null; META.shards -= GACHA_COST; const pool = gachaPool(), w = pool[Math.floor(Math.random() * pool.length)]; let html;

function isoWeek(d = new Date()) { const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate())); t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7)); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); const w = Math.ceil(((t - y0) / 86400000 + 1) / 7); return `${t.getUTCFullYear()}w${String(w).padStart(2, '0')}`; }
function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h; }
