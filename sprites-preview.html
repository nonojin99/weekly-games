<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{background:#141018;margin:0;padding:12px;color:#b9ad96;font:12px system-ui}canvas{display:block;background:#1a1220;border-radius:10px;margin:6px 0}</style></head><body>
<div>행1: 광부(코트색 4) · 행2: 장비 +0/+5/+10/+15 (무기 검/도끼/창/망치) · 행3: 포즈 대기/들어올림/내려침 · 걷기2 · 지침 · 피격 · 좌향</div>
<canvas id="c" width="560" height="330"></canvas>
<script src="sprites.js"></script><script>
const g = document.getElementById('c').getContext('2d');
['#e6d3b3', '#6e8f5a', '#8a6a4a', '#a33a3a'].forEach((c, i) => drawDoll(g, 40 + i * 60, 96, 4, { coat: c, gear: null, weapon: 'pick', pose: 0, leg: 0 }));
[0, 5, 10, 15].forEach((L, i) => drawDoll(g, 300 + i * 65, 96, 4, { coat: '#6e8f5a', gear: { w: L, h: L, c: L, l: L, g: L, b: L }, weapon: 'auto', pose: 0, leg: 0 }));
const G = { w: 7, h: 3, c: 12, l: 6, g: 5, b: 11 };
[0, 1, 2].forEach((p, i) => drawDoll(g, 40 + i * 60, 210, 4, { coat: '#5a6e8f', gear: G, weapon: 'auto', pose: p, leg: 0 }));
drawDoll(g, 230, 210, 4, { coat: '#5a6e8f', gear: G, weapon: 'auto', pose: 0, leg: 1 });
drawDoll(g, 300, 210, 4, { coat: '#5a6e8f', gear: G, weapon: 'auto', pose: 0, leg: 1, tired: true });
drawDoll(g, 370, 210, 4, { coat: '#5a6e8f', gear: G, weapon: 'auto', pose: 0, leg: 0, hit: true });
drawDoll(g, 440, 210, 4, { coat: '#5a6e8f', gear: G, weapon: 'auto', pose: 2, leg: 0, flip: true });
drawMan(g, 510, 210, .9, 1, '#e6d3b3', -1, 2);
// 작은 크기(광산 실제 크기): 픽셀 1.3
[0,1,2].forEach((p,i)=>drawMan(g, 40 + i*30, 300, .3, p/2, '#6e8f5a', 1, i));
[0,5,10,15].forEach((L,i)=>drawDoll(g, 160 + i*30, 300, 1.3, { coat:'#6e8f5a', gear:{w:L,h:L,c:L,l:L,g:L,b:L}, weapon:'auto', pose:0, leg:0 }));
</script></body></html>
